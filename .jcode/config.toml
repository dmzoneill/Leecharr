# Leecharr swarm worker tool policy (project + worktree copies).
# Disables Slack MCP at the server level and blocks any stray slack tool calls.

[tools]
# Belt-and-suspenders: block direct slack tool aliases if they were registered.
disabled = [
  "mcp__slack__slack_send_dm",
  "mcp__slack__slack_post_message",
  "mcp__slack__slack_upload_file",
]

[hooks]
pre_tool = ".jcode/hooks/block-slack-mcp.sh"
pre_tool_timeout_ms = 2000
