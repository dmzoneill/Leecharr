name: Code Quality & Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  backend-quality:
    name: Backend Quality (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Leecharr.sln

      - name: Verify C# formatting
        run: dotnet format src/Leecharr.sln --verify-no-changes

      - name: Audit NuGet package vulnerabilities
        run: dotnet list src/Leecharr.sln package --vulnerable --include-transitive

  frontend-quality:
    name: Frontend Quality (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Leecharr.Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Leecharr.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and i18n catalogue audit
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian Scan
        if: env.GITGUARDIAN_API_KEY != ''
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Log GitGuardian Status
        if: env.GITGUARDIAN_API_KEY == ''
        run: |
          echo "::notice ::GITGUARDIAN_API_KEY is not configured in secrets. If using the GitGuardian GitHub App, webhook monitoring remains active."
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
